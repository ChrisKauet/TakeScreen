[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"

# Embute o runtime do Visual C++ no .exe: roda em qualquer Windows, sem instalar
# o "Visual C++ Redistributable" (sem o erro "VCRUNTIME140.dll não encontrado").
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
